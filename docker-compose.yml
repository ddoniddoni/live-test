services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liveflow
      POSTGRES_USER: liveflow
      POSTGRES_PASSWORD: liveflow
    ports:
      - '5432:5432'
    volumes:
      - liveflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U liveflow -d liveflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  liveflow-postgres:
